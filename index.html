<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberNet MMO - Terminal</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-blue: #00ffff;
            --neon-red: #ff003c;
            --neon-gold: #ffcc00;
            --bg-dark: #050505;
            --panel-bg: #111;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-dark); color: var(--neon-green); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HUD */
        #hud { display: flex; justify-content: space-around; background: #000; padding: 15px; border-bottom: 2px solid var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); z-index: 10; }
        .stat { font-size: 1.1rem; text-transform: uppercase; font-weight: bold; }
        .stat span { color: var(--neon-blue); }

        /* MAIN LAYOUT */
        #game-grid { display: grid; grid-template-columns: 300px 1fr 350px; flex-grow: 1; gap: 10px; padding: 10px; height: calc(100vh - 60px); }
        .panel { background: var(--panel-bg); border: 1px solid #333; border-radius: 5px; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .panel-title { font-size: 0.9rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; color: #888; }

        /* NETWORK GRAPH AREA */
        #network-view { position: relative; background: radial-gradient(circle, #111 0%, #000 100%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px; overflow-y: auto; padding: 40px; }
        .node { width: 120px; height: 120px; border: 2px solid var(--neon-green); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; position: relative; background: rgba(0, 0, 0, 0.8); }
        .node:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--neon-green); }
        .node.active { border-color: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue); background: rgba(0, 255, 255, 0.1); }
        .node.police { border-color: var(--neon-red); }
        .node.bank { border-color: var(--neon-gold); }
        .node.player { border-color: #a020f0; box-shadow: 0 0 10px rgba(160, 32, 240, 0.5); }
        .node-label { font-size: 0.7rem; margin-top: 8px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-width: nowrap; max-width: 110px; }

        /* BUTTONS */
        button { background: var(--neon-green); color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; border-radius: 3px; width: 100%; }
        button:hover { filter: brightness(1.2); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-danger { background: var(--neon-red); color: white; }

        /* SCRIPT EDITOR */
        #script-editor { flex-grow: 1; background: #000; color: var(--neon-blue); border: 1px solid #333; padding: 10px; resize: none; font-size: 0.8rem; outline: none; margin-bottom: 10px; }

        /* LOGS */
        #logs { height: 200px; background: #000; border: 1px solid #222; padding: 10px; overflow-y: auto; font-size: 0.8rem; margin-top: 10px; }
        .log-entry { margin-bottom: 4px; border-left: 2px solid #333; padding-left: 5px; }
        .log-green { color: var(--neon-green); }
        .log-blue { color: var(--neon-blue); }
        .log-red { color: var(--neon-red); }
        .log-gold { color: var(--neon-gold); }

        /* PROGRESS BARS */
        .progress-container { width: 100%; background: #222; height: 12px; margin: 10px 0; border-radius: 10px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--neon-green); transition: width 0.1s linear; }
        .trace-bar { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="hud">
    <div class="stat">USER_IP: <span id="p-ip">...</span></div>
    <div class="stat">NET: <span id="p-net">Localhost</span></div>
    <div class="stat">BALANCE: <span id="p-cash" style="color:var(--neon-gold)">$0</span></div>
</div>

<div id="game-grid">
    <div class="panel">
        <div class="panel-title">TERMINAL DE COMANDO</div>
        <button id="btn-scan-main" onclick="actions.scanNetwork()">ESCANEAR REDE</button>
        
        <div class="panel-title" style="margin-top:20px">AUTOMAÇÃO (SCRIPTOR v1)</div>
        <textarea id="script-editor" placeholder="// Exemplos:&#10;auto_scan();&#10;hack_nearest();"></textarea>
        <button onclick="scriptEngine.run()" style="background:var(--neon-blue)">EXECUTAR SCRIPT</button>
    </div>

    <div class="panel">
        <div class="panel-title">VISUALIZAÇÃO DE TOPOLOGIA</div>
        <div id="network-view"></div>
        <div class="progress-container" id="prog-container">
            <div id="prog-bar" class="progress-bar"></div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">INSPEÇÃO DE NÓ</div>
        <div id="target-ui">
            <p style="color:#555">Selecione uma rede ou player no mapa...</p>
        </div>
        
        <div class="panel-title" style="margin-top:auto">LOGS DE ACESSO</div>
        <div id="logs"></div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO DO FIREBASE COM AS SUAS CHAVES ---
    const firebaseConfig = {
        apiKey: "AIzaSyD8RPa3uKbo3xPstwG7ymxIAjUHrkvDdwk",
        authDomain: "cybernet-9ac4b.firebaseapp.com",
        databaseURL: "https://cybernet-9ac4b-default-rtdb.firebaseio.com",
        projectId: "cybernet-9ac4b",
        storageBucket: "cybernet-9ac4b.firebasestorage.app",
        messagingSenderId: "911554444415",
        appId: "1:911554444415:web:19d470d96fb01d6338d34a"
    };

    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- CONFIGURAÇÕES DE RECOMPENSAS ---
    const CONFIG = {
        types: {
            RESIDENCIAL: { color: 'green', multiplier: 50, time: 3 },
            EMPRESARIAL: { color: 'blue', multiplier: 200, time: 8 },
            BANCO: { color: 'gold', multiplier: 1000, time: 15 },
            POLICIA: { color: 'red', multiplier: 0, time: 20 },
            PLAYER: { color: 'purple', multiplier: 0, time: 12 }
        }
    };

    // --- ESTADO LOCAL DO JOGO ---
    function generateIP() {
        return `${Math.floor(Math.random()*220)+10}.${Math.floor(Math.random()*254)}.${Math.floor(Math.random()*254)}.${Math.floor(Math.random()*254)}`;
    }

    let myId = "p_" + Math.floor(Math.random() * 1000000);
    let myIp = generateIP();

    let state = {
        player: { id: myId, ip: myIp, cash: 200, currentNet: 'Minha Rede', isOnline: true },
        npcRedes: [
            { id: 'npc_0', name: 'Minha Rede', ip: '192.168.0.1', type: 'RESIDENCIAL', devices: 2 }
        ],
        onlinePlayers: {},
        selectedId: null,
        isActionRunning: false,
        isBeingTraced: false
    };

    // --- LIGAÇÃO COM O BANCO DE DADOS (MULTIPLAYER EM TEMPO REAL) ---
    const playerRef = db.ref('players/' + myId);
    playerRef.set(state.player);
    playerRef.onDisconnect().remove(); // Remove o jogador do banco se ele fechar a aba

    // Fica escutando os outros jogadores que entram ou mudam de saldo no banco
    db.ref('players').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        state.onlinePlayers = data;
        
        // Se formos rastreados por outro player e nosso saldo sumiu no banco, avisa localmente
        if (data[myId] && data[myId].cash !== state.player.cash && !state.isActionRunning) {
            state.player.cash = data[myId].cash;
            document.getElementById('p-cash').innerText = `$${state.player.cash}`;
        }
        render();
    });

    // Escuta requisições de ataques/rastreios diretos direcionados a nós
    db.ref('traces/' + myId).on('value', (snapshot) => {
        const traceData = snapshot.val();
        if(traceData && traceData.status === 'active' && !state.isBeingTraced) {
            actions.undergoTrace(traceData.attackerId);
        }
    });

    // --- SISTEMA DE LOGS ---
    function log(msg, type = '') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        const container = document.getElementById('logs');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // --- AÇÕES DO JOGO ---
    const actions = {
        scanNetwork: function() {
            if(state.isActionRunning || state.isBeingTraced) return;
            log("Escaneando frequências e nós adjacentes...", "log-blue");
            
            this.showProgress(2500, () => {
                const types = ['RESIDENCIAL', 'EMPRESARIAL', 'BANCO', 'POLICIA'];
                const type = types[Math.floor(Math.random() * types.length)];
                const newNet = {
                    id: 'npc_' + Date.now(),
                    name: `Net_${type}_${Math.floor(Math.random()*899)+100}`,
                    ip: generateIP(),
                    type: type,
                    devices: Math.floor(Math.random()*8) + 2
                };
                state.npcRedes.push(newNet);
                log(`Nó de rede estático descoberto: ${newNet.ip} [${type}]`, 'log-gold');
                render();
            });
        },

        hackNPC: function(id) {
            if(state.isActionRunning || state.isBeingTraced) return;
            const rede = state.npcRedes.find(r => r.id === id);
            const time = CONFIG.types[rede.type].time * 1000;

            log(`Injetando payload em ${rede.name}...`, 'log-red');
            this.showProgress(time, () => {
                const payout = rede.devices * CONFIG.types[rede.type].multiplier;
                state.player.cash += payout;
                playerRef.update({ cash: state.player.cash });
                log(`Exploit executado com sucesso! Ganho: +$${payout}`, 'log-green');
                render();
            });
        },

        mover: function(name) {
            state.player.currentNet = name;
            playerRef.update({ currentNet: name });
            log(`Alterando rota de proxies. Gateway atual: ${name}`, 'log-blue');
            render();
        },

        // INICIAR RASTREIO CONTRA OUTRO PLAYER REAL
        startPlayerTrace: function(targetId) {
            if(state.isActionRunning || state.isBeingTraced) return;
            const target = state.onlinePlayers[targetId];
            if(!target) return;

            log(`Iniciando caçada de player! Rastreando sinal de ${target.ip}...`, 'log-red');
            
            // Cria o alerta lá no alvo
            db.ref('traces/' + targetId).set({ attackerId: myId, status: 'active' });

            this.showProgress(12000, () => {
                // Ao terminar a barra de progresso, rouba todo o dinheiro do alvo se ele ainda estiver online
                db.ref('players/' + targetId).once('value', (snap) => {
                    const currentTarget = snap.val();
                    if(currentTarget) {
                        const roubo = currentTarget.cash;
                        state.player.cash += roubo;
                        
                        // Atualiza as contas no banco de dados
                        db.ref('players/' + targetId).update({ cash: 0 });
                        playerRef.update({ cash: state.player.cash });
                        
                        log(`ALVO DESTRUÍDO! Você drenou todos os $${roubo} de ${currentTarget.ip}!`, 'log-green');
                    } else {
                        log("O alvo desconectou da rede antes do término do upload.", "log-red");
                    }
                    db.ref('traces/' + targetId).remove();
                });
            }, 'trace');
        },

        // SER RASTREADO POR ALGUÉM (DEFESA)
        undergoTrace: function(attackerId) {
            state.isBeingTraced = true;
            log("ALERTA DE SEGURANÇA: SISTEMA DE DETECÇÃO DE INTRUSÃO ATIVADO! VOCÊ ESTÁ SENDO RASTREADO!", "log-red");
            
            const container = document.getElementById('prog-container');
            const bar = document.getElementById('prog-bar');
            container.style.display = 'block';
            bar.className = "progress-bar trace-bar";
            
            let p = 0;
            const interval = setInterval(() => {
                p += 1;
                bar.style.width = p + "%";
                
                // Se o player fugir mudando de rede, corta o rastreio
                if(!state.isBeingTraced || state.player.cash === 0) {
                    clearInterval(interval);
                    container.style.display = 'none';
                    bar.className = "progress-bar";
                    state.isBeingTraced = false;
                    render();
                }

                if(p >= 100) {
                    clearInterval(interval);
                    container.style.display = 'none';
                    bar.className = "progress-bar";
                    state.isBeingTraced = false;
                    state.player.cash = 0;
                    playerRef.update({ cash: 0 });
                    log("CONTA COMPROMETIDA: Seu IP foi exposto e sua conta foi limpa.", "log-red");
                    render();
                }
            }, 120); // 12 segundos para o player fugir mudando de rede!
        },

        showProgress: function(ms, callback, mode = 'normal') {
            state.isActionRunning = true;
            const container = document.getElementById('prog-container');
            const bar = document.getElementById('prog-bar');
            container.style.display = 'block';
            bar.className = mode === 'trace' ? "progress-bar trace-bar" : "progress-bar";
            bar.style.width = '0%';
            
            let start = null;
            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let percent = Math.min((progress / ms) * 100, 100);
                bar.style.width = percent + "%";
                if (progress < ms) {
                    window.requestAnimationFrame(step);
                } else {
                    container.style.display = 'none';
                    state.isActionRunning = false;
                    callback();
                }
            }
            window.requestAnimationFrame(step);
        }
    };

    // --- ENGINE DE AUTOMATIZAÇÃO (SCRIPTS DO JOGO) ---
    const scriptEngine = {
        run: function() {
            const code = document.getElementById('script-editor').value;
            log("Executando automação customizada...", "log-blue");
            try {
                if(code.includes("auto_scan()")) {
                    actions.scanNetwork();
                }
                if(code.includes("hack_nearest()")) {
                    if(state.npcRedes.length > 1) {
                        actions.hackNPC(state.npcRedes[state.npcRedes.length - 1].id);
                    } else {
                        log("Nenhum host extra disponível para script-hack.", "log-red");
                    }
                }
            } catch(e) {
                log("Erro de sintaxe no Script: " + e.message, "log-red");
            }
        }
    };

    // --- RENDERIZAÇÃO GRÁFICA DA INTERFACE ---
    function render() {
        // HUD
        document.getElementById('p-ip').innerText = state.player.ip;
        document.getElementById('p-net').innerText = state.player.currentNet;
        document.getElementById('p-cash').innerText = `$${state.player.cash}`;

        const view = document.getElementById('network-view');
        view.innerHTML = '';

        // Renderizar Redes Estáticas (NPCs)
        state.npcRedes.forEach(net => {
            const node = document.createElement('div');
            node.className = `node ${net.type.toLowerCase()} ${state.selectedId === net.id ? 'active' : ''}`;
            node.innerHTML = `<div style="font-size:1.5rem">${getIcon(net.type)}</div><div class="node-label"><strong>${net.name}</strong><br>${net.ip}</div>`;
            node.onclick = () => selectNode(net.id, 'npc');
            view.appendChild(node);
        });

        // Renderizar Jogadores Reais Online vindo do Firebase
        Object.keys(state.onlinePlayers).forEach(id => {
            if(id === myId) return; // Não renderizar a si mesmo como inimigo
            const p = state.onlinePlayers[id];
            const node = document.createElement('div');
            node.className = `node player ${state.selectedId === id ? 'active' : ''}`;
            node.innerHTML = `<div style="font-size:1.5rem">🥷</div><div class="node-label"><strong>Hacker_IP</strong><br>${p.ip}</div>`;
            node.onclick = () => selectNode(id, 'player');
            view.appendChild(node);
        });

        // Detalhes do Alvo selecionado
        const targetUI = document.getElementById('target-ui');
        if(state.selectedId !== null) {
            if(state.selectedId.startsWith('npc_')) {
                const net = state.npcRedes.find(r => r.id === state.selectedId);
                if(!net) return;
                targetUI.innerHTML = `
                    <h3>${net.name}</h3>
                    <p>IP: ${net.ip}</p>
                    <p>NÍVEL: <span style="color:var(--neon-${CONFIG.types[net.type].color})">${net.type}</span></p>
                    <p>HOSTS ATIVOS: ${net.devices}</p>
                    <hr style="margin:10px 0; border:0; border-top:1px solid #333">
                    <button onclick="actions.mover('${net.name}')">CONFIGURAR PROXY NESTA REDE</button>
                    <button class="btn-danger" onclick="actions.hackNPC('${net.id}')">INJETAR EXPLOIT</button>
                `;
            } else {
                const p = state.onlinePlayers[state.selectedId];
                if(!p) { state.selectedId = null; return; }
                
                // Se o player estiver na MESMA rede que você, habilita o botão de RASTREAR
                const mesmaRede = p.currentNet === state.player.currentNet;
                
                targetUI.innerHTML = `
                    <h3>PLAYER ONLINE</h3>
                    <p>IP INIMIGO: ${p.ip}</p>
                    <p>SUB-REDE ATUAL: <span style="color:var(--neon-blue)">${p.currentNet}</span></p>
                    <hr style="margin:10px 0; border:0; border-top:1px solid #333">
                    ${mesmaRede 
                        ? `<button class="btn-danger" onclick="actions.startPlayerTrace('${p.id}')">RASTREAR E ROUBAR TUDO</button>`
                        : `<p style="color:var(--neon-red); font-size:0.8rem; text-align:center;">Para rastrear este player, você precisa se mover para a mesma rede que ele está conectado (${p.currentNet}).</p>`
                    }
                `;
            }
        }
    }

    function selectNode(id, category) {
        state.selectedId = id;
        render();
    }

    function getIcon(type) {
        switch(type) {
            case 'RESIDENCIAL': return '🏠';
            case 'EMPRESARIAL': return '🏢';
            case 'BANCO': return '💰';
            case 'POLICIA': return '🚔';
            default: return '🌐';
        }
    }

    // Inicialização
    render();
    log("Terminal CyberNet MMO v1.5 pronto. Banco de dados em tempo real ativo.", "log-green");
</script>

</body>
</html>
